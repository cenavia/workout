[project]
name = "workout-chatbot"
version = "0.1.0"
description = "AI Workout Assistant with RAG capabilities built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-openai>=0.2.14",
    "langchain-anthropic>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-community>=0.3.14",
    "langgraph-checkpoint-postgres>=2.0.9",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "jinja2>=3.1.6",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "chromadb>=0.5.23",
    "pypdf>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ipykernel>=6.29.0",
    "langgraph-cli[inmem]>=0.1.55",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/api"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
